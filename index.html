<!DOCTYPE html> 
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Casino Taj Pokhara - Forex Board</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">

  <script>
    // =========================================================================
    // 🔗 PASTE YOUR GOOGLE SHEET CSV LINK HERE:
    // =========================================================================
    const GOOGLE_SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQD5yVDmGDHI75gPZURHrzf7JbmeFmvmwSVNBszzvn1gv9ncYbPV38srsZ6tIuwpWUHnoaZf2Ju81Xe/pub?output=csv"; 

    // Fallback defaults
    let TODAY_DATE = "02 NOVEMBER 2026";
    let RATES = {
      USD: "149.00",
      INR: "1.60",
      EUR: "166.00",
      GBP: "200.00",
      CNY: "22.00",
      MYR: "36.00",
      AED: "40.00",
      JPY: "0.90",
      AUD: "104.00",
      SGD: "116.00",
      HKD: "18.00",
      CAD: "106.00",
      CHF: "180.00",
      SAR: "39.00",
      QAR: "40.00",
      THB: "3.00",
      KRW: "0.10",
      SEK: "14.00",
      DKK: "22.00",
      KWD: "480.00"
    };
  </script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    /* Exact 720 x 1280 Canvas */
    body {
      width: 720px;
      height: 1280px;
      margin: 0 auto;
      overflow: hidden;
      background: radial-gradient(circle at 50% 15%, #4a0910 0%, #290408 55%, #140204 100%);
      color: #ffffff;
      font-family: 'Plus Jakarta Sans', sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px 18px 12px;
    }

    .header {
      text-align: center;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(245, 208, 124, 0.25);
    }

    .casino-badge {
      display: inline-block;
      background: rgba(245, 208, 124, 0.12);
      border: 1px solid rgba(245, 208, 124, 0.4);
      padding: 3px 16px;
      border-radius: 50px;
      font-family: 'Cinzel', serif;
      font-size: 11px;
      letter-spacing: 2.5px;
      color: #f5d07c;
      margin-bottom: 4px;
    }

    .billboard-title {
      font-family: 'Cinzel', serif;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 2px;
      color: #ffffff;
      text-shadow: 0 4px 15px rgba(0,0,0,0.6);
      margin-bottom: 2px;
    }

    .display-date {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 2px;
      color: #f5d07c;
      text-transform: uppercase;
    }

    .table-headers {
      display: grid;
      grid-template-columns: 2.3fr 1fr 0.7fr 1.8fr;
      padding: 6px 14px;
      font-size: 10.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #f5d07c;
      background: rgba(0, 0, 0, 0.35);
      border-radius: 6px;
      margin: 8px 0 4px 0;
    }

    .header-right { text-align: right; }

    .currency-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1;
      justify-content: space-between;
    }

    .currency-row {
      display: grid;
      grid-template-columns: 2.3fr 1fr 0.7fr 1.8fr;
      align-items: center;
      padding: 5.5px 14px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 6px;
      font-variant-numeric: tabular-nums;
    }

    .curr-name-box {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .flag-icon { font-size: 18px; line-height: 1; }
    .curr-fullname { font-size: 13.5px; font-weight: 600; }

    .curr-code {
      font-size: 11.5px;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.75);
      background: rgba(255, 255, 255, 0.08);
      padding: 2px 6px;
      border-radius: 4px;
      width: fit-content;
    }

    .curr-unit { font-size: 12.5px; color: rgba(255, 255, 255, 0.65); }

    .curr-rate {
      text-align: right;
      font-size: 16px;
      font-weight: 700;
      color: #f5d07c;
      letter-spacing: 0.5px;
    }

    .curr-rate small {
      font-size: 10px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.6);
      margin-right: 4px;
    }

    .billboard-footer {
      padding-top: 8px;
      border-top: 1px solid rgba(245, 208, 124, 0.25);
      text-align: center;
    }

    .notice-text {
      font-size: 10px;
      letter-spacing: 1px;
      color: rgba(255, 255, 255, 0.8);
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .ticker-wrapper {
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 50px;
      overflow: hidden;
      padding: 6px 0;
    }

    .ticker-content {
      display: inline-block;
      white-space: nowrap;
      animation: ticker 22s linear infinite;
      font-family: 'Cinzel', serif;
      font-size: 11px;
      letter-spacing: 2px;
      color: #f5d07c;
    }

    @keyframes ticker {
      0% { transform: translateX(100%); }
      100% { transform: translateX(-100%); }
    }
  </style>
</head>
<body>

  <header class="header">
    <div class="casino-badge">Casino Taj • Pokhara</div>
    <h1 class="billboard-title">FOREIGN EXCHANGE RATES</h1>
    <div class="display-date" id="billboard-date">02 NOVEMBER 2026</div>
  </header>

  <div class="table-headers">
    <div>Currency</div>
    <div>Code</div>
    <div>Unit</div>
    <div class="header-right">Buying (NPR)</div>
  </div>

  <div class="currency-list" id="currency-list"></div>

  <footer class="billboard-footer">
    <div class="notice-text">⚠ All foreign currency exchange is final • No reversals processed</div>
    <div class="ticker-wrapper">
      <div class="ticker-content">
        WELCOME TO CASINO TAJ POKHARA • PLAY BIG, WIN BIG • BEST RATES GUARANTEED • ENJOY YOUR EXPERIENCE
      </div>
    </div>
  </footer>

  <script>
    const currencyInfo = [
      { code: "USD", name: "US Dollar", flag: "🇺🇸", unit: 1 },
      { code: "INR", name: "Indian Rupee", flag: "🇮🇳", unit: 1 },
      { code: "EUR", name: "Euro", flag: "🇪🇺", unit: 1 },
      { code: "GBP", name: "Pound Sterling", flag: "🇬🇧", unit: 1 },
      { code: "CNY", name: "Chinese Yuan", flag: "🇨🇳", unit: 1 },
      { code: "MYR", name: "Malaysian Ringgit", flag: "🇲🇾", unit: 1 },
      { code: "AED", name: "UAE Dirham", flag: "🇦🇪", unit: 1 },
      { code: "JPY", name: "Japanese Yen", flag: "🇯🇵", unit: 1 },
      { code: "AUD", name: "Australian Dollar", flag: "🇦🇺", unit: 1 },
      { code: "SGD", name: "Singapore Dollar", flag: "🇸🇬", unit: 1 },
      { code: "HKD", name: "Hong Kong Dollar", flag: "🇭🇰", unit: 1 },
      { code: "CAD", name: "Canadian Dollar", flag: "🇨🇦", unit: 1 },
      { code: "CHF", name: "Swiss Franc", flag: "🇨🇭", unit: 1 },
      { code: "SAR", name: "Saudi Riyal", flag: "🇸🇦", unit: 1 },
      { code: "QAR", name: "Qatari Riyal", flag: "🇶🇦", unit: 1 },
      { code: "THB", name: "Thai Baht", flag: "🇹🇭", unit: 1 },
      { code: "KRW", name: "South Korean Won", flag: "🇰🇷", unit: 1 },
      { code: "SEK", name: "Swedish Krona", flag: "🇸🇪", unit: 1 },
      { code: "DKK", name: "Danish Krone", flag: "🇩🇰", unit: 1 },
      { code: "KWD", name: "Kuwaiti Dinar", flag: "🇰🇼", unit: 1 }
    ];

    function renderBoard() {
      document.getElementById('billboard-date').textContent = TODAY_DATE;
      const container = document.getElementById('currency-list');
      container.innerHTML = '';

      currencyInfo.forEach(item => {
        const rate = RATES[item.code] || "0.00";
        const row = document.createElement('div');
        row.className = 'currency-row';
        row.innerHTML = `
          <div class="curr-name-box">
            <span class="flag-icon">${item.flag}</span>
            <span class="curr-fullname">${item.name}</span>
          </div>
          <div><span class="curr-code">${item.code}</span></div>
          <div class="curr-unit">${item.unit}</div>
          <div class="curr-rate"><small>NPR</small>${rate}</div>
        `;
        container.appendChild(row);
      });
    }

    // Fixed parser: Pulls Rate specifically from Column C (index 2)
    async function syncGoogleSheet() {
      if (!GOOGLE_SHEET_CSV_URL || GOOGLE_SHEET_CSV_URL.includes("PASTE_YOUR_LINK_HERE")) return;
      try {
        const res = await fetch(GOOGLE_SHEET_CSV_URL + (GOOGLE_SHEET_CSV_URL.includes('?') ? '&' : '?') + 't=' + Date.now());
        const csv = await res.text();
        const lines = csv.split('\n');
        
        lines.forEach(line => {
          if (!line.trim()) return;
          const parts = line.split(',').map(s => s ? s.trim().replace(/^["']|["']$/g, '') : '');
          const code = parts[0]?.toUpperCase();

          // Date is in Column B (parts[1])
          if (code === 'DATE' && parts[1]) {
            TODAY_DATE = parts[1];
          } 
          // Rate is in Column C (parts[2])
          else if (code && RATES.hasOwnProperty(code)) {
            const rawRate = parts[2];
            if (rawRate !== undefined && rawRate !== '') {
              const num = parseFloat(rawRate);
              RATES[code] = !isNaN(num) ? num.toFixed(2) : rawRate;
            }
          }
        });

        renderBoard();
      } catch (err) {
        console.error("Sheet sync error:", err);
      }
    }

    renderBoard();
    if (GOOGLE_SHEET_CSV_URL && !GOOGLE_SHEET_CSV_URL.includes("PASTE_YOUR_LINK_HERE")) {
      syncGoogleSheet();
      setInterval(syncGoogleSheet, 30000); // Auto-syncs every 30 seconds
    }
  </script>
</body>
</html>
