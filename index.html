<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Casino Taj Pokhara - Forex Board</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">

  <script>
    // ========================================================
    // ✍️ CHANGE YOUR DAILY DATE & RATES HERE:
    // ========================================================
    const TODAY_DATE = "02 NOVEMBER 2026";

    const RATES = {
      USD: "149.00",
      EUR: "166.00",
      GBP: "200.00",
      KWD: "480.00",
      CHF: "180.00",
      SGD: "116.00",
      CAD: "106.00",
      AUD: "104.00",
      AED: "40.00",
      QAR: "40.00",
      SAR: "39.00",
      MYR: "36.00",
      CNY: "22.00",
      DKK: "22.00",
      HKD: "18.00",
      SEK: "14.00",
      THB: "3.00",
      JPY: "0.90",
      KRW: "0.10"
    };
    // ========================================================
  </script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    /* Exact 720 x 1280 Vertical Billboard Canvas */
    body {
      width: 720px;
      height: 1280px;
      margin: 0 auto;
      overflow: hidden;
      background: radial-gradient(circle at 50% 15%, #4a0910 0%, #290408 55%, #140204 100%);
      color: #ffffff;
      font-family: 'Plus Jakarta Sans', sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 22px 20px 16px;
    }

    /* Header */
    .header {
      text-align: center;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(245, 208, 124, 0.25);
    }

    .casino-badge {
      display: inline-block;
      background: rgba(245, 208, 124, 0.12);
      border: 1px solid rgba(245, 208, 124, 0.4);
      padding: 4px 18px;
      border-radius: 50px;
      font-family: 'Cinzel', serif;
      font-size: 13px;
      letter-spacing: 3px;
      color: #f5d07c;
      margin-bottom: 6px;
    }

    .billboard-title {
      font-family: 'Cinzel', serif;
      font-size: 27px;
      font-weight: 800;
      letter-spacing: 2px;
      color: #ffffff;
      text-shadow: 0 4px 15px rgba(0,0,0,0.6);
      margin-bottom: 4px;
    }

    .display-date {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 2px;
      color: #f5d07c;
      text-transform: uppercase;
    }

    /* Table Columns Header */
    .table-headers {
      display: grid;
      grid-template-columns: 2.2fr 1fr 0.8fr 1.8fr;
      padding: 8px 14px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #f5d07c;
      background: rgba(0, 0, 0, 0.35);
      border-radius: 8px;
      margin: 10px 0 6px 0;
    }

    .header-right { text-align: right; }

    /* 19 Currencies List - Perfectly Fitted (No Scrollbar) */
    .currency-list {
      display: flex;
      flex-direction: column;
      gap: 5px;
      flex: 1;
      justify-content: space-between;
    }

    .currency-row {
      display: grid;
      grid-template-columns: 2.2fr 1fr 0.8fr 1.8fr;
      align-items: center;
      padding: 7px 14px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 8px;
      font-variant-numeric: tabular-nums;
    }

    .curr-name-box {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .flag-icon {
      font-size: 20px;
      line-height: 1;
    }

    .curr-fullname {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.2px;
    }

    .curr-code {
      font-size: 12px;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.75);
      background: rgba(255, 255, 255, 0.08);
      padding: 2px 7px;
      border-radius: 4px;
      width: fit-content;
    }

    .curr-unit {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.65);
    }

    .curr-rate {
      text-align: right;
      font-size: 17px;
      font-weight: 700;
      color: #f5d07c;
      letter-spacing: 0.5px;
    }

    .curr-rate small {
      font-size: 10px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.6);
      margin-right: 4px;
    }

    /* Footer Marquee */
    .billboard-footer {
      padding-top: 10px;
      border-top: 1px solid rgba(245, 208, 124, 0.25);
      text-align: center;
    }

    .notice-text {
      font-size: 10.5px;
      letter-spacing: 1px;
      color: rgba(255, 255, 255, 0.8);
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .ticker-wrapper {
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 50px;
      overflow: hidden;
      padding: 7px 0;
    }

    .ticker-content {
      display: inline-block;
      white-space: nowrap;
      animation: ticker 22s linear infinite;
      font-family: 'Cinzel', serif;
      font-size: 11.5px;
      letter-spacing: 2px;
      color: #f5d07c;
    }

    @keyframes ticker {
      0% { transform: translateX(100%); }
      100% { transform: translateX(-100%); }
    }
  </style>
</head>
<body>

  <!-- Top Header -->
  <header class="header">
    <div class="casino-badge">Casino Taj • Pokhara</div>
    <h1 class="billboard-title">FOREIGN EXCHANGE RATES</h1>
    <div class="display-date" id="billboard-date"></div>
  </header>

  <!-- Column Headers -->
  <div class="table-headers">
    <div>Currency</div>
    <div>Code</div>
    <div>Unit</div>
    <div class="header-right">Buying (NPR)</div>
  </div>

  <!-- 19 Rates Grid -->
  <div class="currency-list" id="currency-list"></div>

  <!-- Bottom Notice & Ticker -->
  <footer class="billboard-footer">
    <div class="notice-text">⚠ All foreign currency exchange is final • No reversals processed</div>
    <div class="ticker-wrapper">
      <div class="ticker-content">
        WELCOME TO CASINO TAJ POKHARA • PLAY BIG, WIN BIG • BEST RATES GUARANTEED • ENJOY YOUR EXPERIENCE
      </div>
    </div>
  </footer>

  <script>
    const currencyInfo = [
      { code: "USD", name: "US Dollar", flag: "🇺🇸" },
      { code: "EUR", name: "Euro", flag: "🇪🇺" },
      { code: "GBP", name: "Pound Sterling", flag: "🇬🇧" },
      { code: "KWD", name: "Kuwaiti Dinar", flag: "🇰🇼" },
      { code: "CHF", name: "Swiss Franc", flag: "🇨🇭" },
      { code: "SGD", name: "Singapore Dollar", flag: "🇸🇬" },
      { code: "CAD", name: "Canadian Dollar", flag: "🇨🇦" },
      { code: "AUD", name: "Australian Dollar", flag: "🇦🇺" },
      { code: "AED", name: "UAE Dirham", flag: "🇦🇪" },
      { code: "QAR", name: "Qatari Riyal", flag: "🇶🇦" },
      { code: "SAR", name: "Saudi Riyal", flag: "🇸🇦" },
      { code: "MYR", name: "Malaysian Ringgit", flag: "🇲🇾" },
      { code: "CNY", name: "Chinese Yuan", flag: "🇨🇳" },
      { code: "DKK", name: "Danish Krone", flag: "🇩🇰" },
      { code: "HKD", name: "Hong Kong Dollar", flag: "🇭🇰" },
      { code: "SEK", name: "Swedish Krona", flag: "🇸🇪" },
      { code: "THB", name: "Thai Baht", flag: "🇹🇭" },
      { code: "JPY", name: "Japanese Yen", flag: "🇯🇵" },
      { code: "KRW", name: "South Korean Won", flag: "🇰🇷" }
    ];

    // Set Date
    document.getElementById('billboard-date').textContent = TODAY_DATE;

    // Render 19 items cleanly
    const container = document.getElementById('currency-list');
    currencyInfo.forEach(item => {
      const rate = RATES[item.code] || "0.00";
      const row = document.createElement('div');
      row.className = 'currency-row';
      row.innerHTML = `
        <div class="curr-name-box">
          <span class="flag-icon">${item.flag}</span>
          <span class="curr-fullname">${item.name}</span>
        </div>
        <div><span class="curr-code">${item.code}</span></div>
        <div class="curr-unit">1</div>
        <div class="curr-rate"><small>NPR</small>${rate}</div>
      `;
      container.appendChild(row);
    });
  </script>
</body>
</html>
